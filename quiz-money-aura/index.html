    const results=[{type:"🌊",name:"吸金海绵型 · 钱追着你跑",desc:"你有一种天生的“吸引金钱”的磁场。不是说你会中彩票，而是你走到哪里，机会和资源都会向你靠拢。你擅长借力、擅长让人愿意帮你——你的财富不是靠辛苦换来的，是靠能量吸引来的。",label:"钱追着你跑"},{type:"🎯",name:"猎手型 · 你擅长捕捉机会",desc:"你对“机会”的嗅觉比谁都灵敏。别人还没看明白的时候，你已经出手了。你擅长在信息中找到规律，在变化中发现缝隙。你的财富来自于“比别人快一步”。",label:"机会捕手"},{type:"🌱",name:"播种型 · 你擅长长期积累",desc:"你不是赚快钱的人——你是那种播下种子、耐心浇水、等待丰收的人。你相信复利的力量，相信时间会给你答案。你的财富来自于“坚持做对的事”。",label:"长期主义者"},{type:"🔗",name:"连接型 · 你靠人脉赚钱",desc:"你的价值不在于你多能干，而在于你认识谁、能把谁连接到一起。你是天然的资源整合者，你的财富来自于“把合适的人放在合适的位置上”。",label:"资源整合者"},{type:"💡",name:"灵感型 · 你靠创意赚钱",desc:"你的脑子一天能冒一百个想法——而且很多是能变成钱的。你擅长从0到1，擅长创造别人没想过的东西。你的财富来自于“把想法变成现实”。",label:"创意变现者"},{type:"🛡️",name:"守财型 · 你擅长守住钱",desc:"你可能不是赚得最多的，但你绝对是最能留得住的。你懂规划、懂分寸、懂什么时候该花什么时候不该花。你的财富来自于“不犯错”。",label:"财富守护者"}];

    function showFR(){document.getElementById('fullQuizPage').classList.remove('active');const c=[0,0,0,0];fA.forEach(a=>c[a]++);let m=0;for(let i=1;i<4;i++)if(c[i]>c[m])m=i;let ri=m%results.length;if(m===0&&c[3]>=6)ri=5;else if(m===1&&c[3]>=6)ri=1;const r=results[ri];const sc=Math.round(c[m]/20*100);const ds=[0,0,0,0,0];fA.forEach((a,i)=>{const d=Math.floor(i/4);if(d<5)ds[d]+=a+1});const dn=ds.map(s=>Math.min(100,Math.round(s/16*100)));let pt='';if(ri===0)pt='🌊 吸金海绵型 → 你的财富密码是「吸引」不是「追逐」。你不用太累，你只需要让自己成为一个有能量、有连接力的人——钱自然会找到你。';else if(ri===1)pt='🎯 猎手型 → 你的财富密码是「敏锐」。保持你对信息的敏感度，永远比人多走一步。但记住：猎手也需要耐心，不是每次出手都必须有收获。';else if(ri===2)pt='🌱 播种型 → 你的财富密码是「坚持」。你不需要羡慕别人的速度，你只需要相信时间的力量。你的财富会在积累中爆发。';else if(ri===3)pt='🔗 连接型 → 你的财富密码是「关系」。你不是在赚钱，你是在搭建网络。你的财富=你的人脉×你的格局。';else if(ri===4)pt='💡 灵感型 → 你的财富密码是「创造」。你的脑子里装着一座金矿——关键是选一个想法，把它做出来。行动比想法更值钱。';else pt='🛡️ 守财型 → 你的财富密码是「克制」。你不需要赚最多，你只需要犯最少的错。在别人疯狂的时候你冷静，这就是你的超能力。';const acts=[["第1-30天：觉察你的金钱模式","记录你每一次和钱打交道的感受——是紧张、兴奋、还是平静？找到你和钱的真实关系。"],["第1-30天：激活你的体质","根据你的吸金类型，做一件激活体质的事——海绵型去连接一个人，猎手型去研究一个新机会。"],["第31-60天：扩大你的磁场","让自己更多地出现在有“钱味”的场合——社群、活动、课程、圈子。你的体质需要环境来激活。"],["第61-90天：复利你的财富","把你的吸金体质变成习惯——每个月做一件“吸金动作”，让钱成为你生活的一部分。"]];let html=`<div class="result-type">${r.type}</div><div class="result-name">${r.name}</div><div class="score">吸金指数 · ${sc}% · ${r.label}</div><div class="result-desc">${r.desc}</div><div class="chart-box"><h4>📊 五维雷达图分析</h4><div class="radar-container"><canvas id="fullRadar" width="280" height="280"></canvas></div></div><div class="path-box"><h4>🛤️ 你的吸金进化路径</h4><p style="font-size:14px;color:#c8b8a8;line-height:1.8">${pt}</p></div><div class="action-plan"><h4>📋 90天吸金体质激活计划</h4>${acts.map((a,i)=>`<div class="action-item"><div class="action-num">${i+1}</div><div class="action-text"><strong>${a[0]}</strong><br>${a[1]}</div></div>`).join('')}</div><p style="font-size:13px;color:#a89080;margin-top:16px">💡 你不是不会搞钱，你只是还没激活自己的吸金体质</p>`;document.getElementById('fullResult').innerHTML=html;document.getElementById('fullResult').classList.add('active');setTimeout(()=>drawRadar('fullRadar',dn),300)}
    function drawRadar(id,d){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');const cx=c.width/2,cy=c.height/2,r=100,s=5;ctx.clearRect(0,0,c.width,c.height);for(let l=1;l<=5;l++){ctx.beginPath();for(let i=0;i<s;i++){const a=(Math.PI*2/s)*i-Math.PI/2;const rr=(r/5)*l;const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle='#3d3028';ctx.lineWidth=1;ctx.stroke()}for(let i=0;i<s;i++){const a=(Math.PI*2/s)*i-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='#3d3028';ctx.stroke()}ctx.beginPath();for(let i=0;i<s;i++){const a=(Math.PI*2/s)*i-Math.PI/2;const rr=(d[i]/100)*r;const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.closePath();ctx.fillStyle='rgba(212,168,87,0.15)';ctx.fill();ctx.strokeStyle='#d4a857';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<s;i++){const a=(Math.PI*2/s)*i-Math.PI/2;const rr=(d[i]/100)*r;ctx.beginPath();ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),5,0,Math.PI*2);ctx.fillStyle='#d4a857';ctx.fill()}ctx.fillStyle='#a89080';ctx.font='12px -apple-system,sans-serif';ctx.textAlign='center';for(let i=0;i<s;i++){const a=(Math.PI*2/s)*i-Math.PI/2;ctx.fillText(dimNames[i],cx+(r+25)*Math.cos(a),cy+(r+25)*Math.sin(a)+4)}}
</script>
