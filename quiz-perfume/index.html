<body>
    <div class="container" id="app">

        <!-- ====== 欢迎页 ====== -->
        <div class="welcome" id="welcome">
            <div class="emoji-top">🌿</div>
            <h1>你的气质更像哪款经典香水？</h1>

            <div class="dims">
                <div class="dim-item"><span class="dot"></span> 审美偏好 —— 你的眼睛喜欢什么？</div>

            </div>
            <button class="btn" onclick="startQuiz()">开始测试</button>
        </div>

        <!-- ====== 快速版5题 ====== -->
        <div class="quiz-page" id="quizPage">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">1/5</div>
            <div class="question"><span class="q-num" id="qNum">1</span><h3 id="qText"></h3></div>
            <div class="options" id="optionsBox"></div>
            <button class="btn btn-small hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
        </div>

        <!-- ====== 快速版结果 ====== -->
        <div class="quick-result" id="quickResult">
            <div class="result-type" id="qrType"></div>
            <div class="result-name" id="qrName"></div>
            <div class="result-desc" id="qrDesc"></div>
            <div class="result-chart"><canvas id="quickRadar" width="260" height="260"></canvas></div>
            <div class="upgrade-box">
                <h4>🎯 以上只是5题快速版</h4>
                <p>完成全部20题，你将获得：<br>
                ✅ 你的专属本命香标签<br>
                ✅ 五维雷达图深度分析<br>
                ✅ 香调风格解读<br>
                ✅ 气质氛围感关键词</p>
                <button class="btn" onclick="showFullQuiz()">解锁完整20题测试</button>
            </div>
        </div>

        <!-- ====== 完整版20题 ====== -->
        <div class="quiz-page" id="fullQuizPage">
            <div class="progress-bar"><div class="progress-fill" id="fullProgressFill"></div></div>
            <div class="progress-text" id="fullProgressText">1/20</div>
            <div class="question"><span class="q-num" id="fullQNum">1</span><h3 id="fullQText"></h3></div>
            <div class="options" id="fullOptionsBox"></div>
            <button class="btn btn-small hidden" id="fullNextBtn" onclick="fullNextQuestion()">下一题</button>
        </div>

        <!-- ====== 完整版结果 ====== -->
        <div class="full-result" id="fullResult"></div>

    </div>

    <script>
        // =====================================================
        // 快速版5题
        // =====================================================
        const quickQuestions = [
            { q: "你更喜欢哪种氛围？", opts: ["安静、清冷、有距离感", "温暖、浪漫、有故事感", "明亮、阳光、有活力", "深邃、沉稳、有质感"] },
            { q: "你更倾向哪种生活状态？", opts: ["慢下来，感受每一个当下", "忙碌但不失优雅", "充满变化和新鲜感", "稳定、有序、有规划"] },
            { q: "你的朋友最常用哪个词形容你？", opts: ["安静、清冷", "温柔、浪漫", "阳光、开朗", "沉稳、可靠"] },
            { q: "你更喜欢哪种香气氛围？", opts: ["茶香、木质调", "花香、果香", "柑橘、清新调", "檀木、琥珀调"] },

        // =====================================================
        // 完整版20题
        // =====================================================
        const fullQuestions = [
            { q: "你更喜欢哪种色彩氛围？", opts: ["黑白灰、大地色系，清冷克制", "奶油色、莫兰迪色，温柔浪漫", "明亮色、暖色调，活力阳光", "深色系、复古色系，沉稳深邃"] },
            { q: "你更喜欢哪种自然场景？", opts: ["清晨薄雾里的茶山", "午后阳光下的玫瑰园", "地中海边的柠檬树", "深山里的百年古寺"] },
            { q: "你更喜欢哪种面料触感？", opts: ["挺括的亚麻、有质感的棉", "柔软的丝绸、蕾丝", "舒适的针织、卫衣", "厚重的粗花呢、羊毛"] },
            { q: "你更喜欢哪种空间氛围？", opts: ["极简、留白、有呼吸感", "温暖、柔软、有生活感", "开放、明亮、有活力", "沉稳、安静、有书卷气"] },
            { q: "你更倾向哪种生活状态？", opts: ["慢下来，感受每一个当下", "忙而不乱，保持优雅", "充满变化和新鲜感", "稳定有序，按规划推进"] },
            { q: "你更喜欢哪种度过周末的方式？", opts: ["一个人喝茶读书", "和朋友逛街喝咖啡", "去户外运动晒太阳", "在家安静地休息"] },
            { q: "你对「效率」的态度是：", opts: ["不着急，我按自己的节奏来", "重要，但不想被效率绑架", "效率很重要，我喜欢高效", "稳定推进比效率更重要"] },
            { q: "你更喜欢哪种城市氛围？", opts: ["京都、杭州——静气", "巴黎、南法——浪漫", "洛杉矶、悉尼——阳光", "伦敦、柏林——质感"] },
            { q: "你的朋友最常用哪个词形容你？", opts: ["安静、清冷、有距离感", "温柔、浪漫、有故事感", "阳光、开朗、有感染力", "沉稳、可靠、有深度"] },
            { q: "你给人的第一印象通常是：", opts: ["不太好接近，但相处后发现很温柔", "很亲切，让人想靠近", "很阳光，和他/她在一起很开心", "很稳，让人觉得踏实"] },
            { q: "你更欣赏哪种气质？", opts: ["清冷克制的高级感", "慵懒迷人的松弛感", "活力四射的少年感", "沉稳深邃的知性感"] },
            { q: "你更倾向于哪种人生哲学？", opts: ["「我属于自己」", "「我属于爱」", "「我属于世界」", "「我属于时间」"] },
            { q: "你表达爱意的方式更接近：", opts: ["默默陪伴，用行动守护", "温柔表达，用细节打动", "热情直接，用笑容感染", "沉稳承诺，用时间证明"] },
            { q: "你更期待什么样的爱情？", opts: ["心有灵犀的默契", "浪漫温柔的陪伴", "活力四射的探险", "深沉持久的守护"] },
            { q: "你在感情中更像：", opts: ["独立高冷的猫", "温柔依赖的恋人", "热情自由的灵魂", "沉稳守护的港湾"] },
            { q: "你更渴望哪种亲密关系？", opts: ["被理解，不需要解释", "被宠爱，不需要坚强", "被陪伴，不需要孤单", "被信任，不需要证明"] },
            { q: "你内心最渴望的状态是：", opts: ["不被定义的自由", "被爱包围的温暖", "充满活力的激情", "内心平静的深度"] },
            { q: "你更想成为哪种人？", opts: ["一个不随波逐流的人", "一个温暖有力量的人", "一个永远热爱生活的人", "一个历尽沧桑依然温柔的人"] },
            { q: "你更害怕什么？", opts: ["失去自我", "不被爱", "失去活力", "失去方向"] },
            { q: "你希望自己的人生更像：", opts: ["一幅留白的水墨画", "一首浪漫的诗", "一部热烈的电影", "一本耐读的书"] }
        ];

        // =====================================================
        // 6种香水气质结果
        // =====================================================
        const perfumeResults = [{
            type: "🌿",
            name: "白茶清欢 · 清冷疏离感",
            desc: "像清晨薄雾里的茶山，安静、克制、不争不抢。你的气质是「有距离感的温柔」，不需要讨好任何人，也不在意别人的眼光。你有一种淡淡的存在感——不喧哗，但让人难以忽视。穿在你身上的香气，是白茶的清冽和木质的沉稳。",
            label: "清冷疏离"
        }, {
            type: "🌹",
            name: "玫瑰之约 · 浪漫温柔感",
            desc: "像午后花园里盛开的玫瑰，优雅、迷人、有故事感。你的气质是「有温度的浪漫」，让人想靠近、想了解、想守护。你有一种天生的吸引力——不是刻意为之，而是你站在那里就让人移不开眼。穿在你身上的香气，是玫瑰的馥郁和果香的甜美。",
            label: "浪漫温柔"
        }, {
            type: "🍊",
            name: "柑橘阳光 · 活力少年感",
            desc: "像地中海阳光下的一杯柠檬水，干净、明亮、有感染力。你的气质是「让人心情变好的存在」，走到哪里都带着光。你有一种天然的亲和力——和你在一起的时候，世界好像没那么复杂了。穿在你身上的香气，是柑橘的清新和海洋的爽朗。",
            label: "活力少年"
        }, {
            type: "🪵",
            name: "檀木沉静 · 知性沉稳感",
            desc: "像一座百年图书馆里的旧木书架，安静、有深度、耐人寻味。你的气质是「越相处越着迷」的类型，不张扬但让人难忘。你有一种让人安心的力量——你不急着表达，但每句话都有分量。穿在你身上的香气，是檀木的醇厚和琥珀的温暖。",
            label: "知性沉稳"
        }, {
            type: "🌾",
            name: "鸢尾清雅 · 文艺清冷感",
            desc: "像晨露中的鸢尾花，清冷、有诗意、不随波逐流。你的气质是「有自己审美体系」的文艺灵魂，不追随潮流，只追随自己的心。你有一种独特的辨识度——你穿的不是衣服，是态度；你散发的不只是香气，是故事。穿在你身上的香气，是鸢尾的粉感和木质的地气。",
            label: "文艺清冷"
        }, {
            type: "🕯️",
            name: "乌木秘语 · 神秘高级感",
            desc: "像暗夜里的焚香，深邃、复杂、有辨识度。你的气质是「让人忍不住想读懂」的谜，你不需要解释自己，但你的存在本身就是一种邀请。你有一种让人无法忽视的气场——你不争不抢，但你就是中心。穿在你身上的香气，是乌木的深邃和烟熏的神秘。",
            label: "神秘高级"
        }];

        // =====================================================
        // 状态变量
        // =====================================================
        let quickAnswers = [];
        let quickCurrent = 0;
        let fullAnswers = [];
        let fullCurrent = 0;

        // =====================================================
        // 快速版逻辑
        // =====================================================
        function startQuiz() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('quizPage').classList.add('active');
            quickCurrent = 0;
            quickAnswers = [];
            showQuickQuestion();
        }

        function showQuickQuestion() {
            if (quickCurrent >= 5) {
                showQuickResult();
                return;
            }
            const q = quickQuestions[quickCurrent];
            document.getElementById('qNum').textContent = quickCurrent + 1;
            document.getElementById('qText').textContent = q.q;
            document.getElementById('progressFill').style.width = ((quickCurrent / 5) * 100) + '%';
            document.getElementById('progressText').textContent = (quickCurrent + 1) + '/5';

            let html = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                const sel = (quickAnswers[quickCurrent] === i) ? ' selected' : '';
                html += `<button class="option${sel}" onclick="selectQuick(${i})"><span class="opt-label">${labels[i]}</span>${opt}</button>`;
            });
            document.getElementById('optionsBox').innerHTML = html;
            document.getElementById('nextBtn').classList.add('hidden');
        }

        function selectQuick(idx) {
            quickAnswers[quickCurrent] = idx;
            const options = document.querySelectorAll('#optionsBox .option');
            options.forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            quickCurrent++;
            showQuickQuestion();
        }

        function showQuickResult() {
            document.getElementById('quizPage').classList.remove('active');
            document.getElementById('quickResult').classList.add('active');
            // 统计选最多的选项
            const counts = [0, 0, 0, 0];
            quickAnswers.forEach(a => counts[a]++);
            let maxIdx = 0;
            for (let i = 1; i < 4; i++) {
                if (counts[i] > counts[maxIdx]) maxIdx = i;
            }
            const r = perfumeResults[maxIdx % perfumeResults.length];
            document.getElementById('qrType').textContent = r.type;
            document.getElementById('qrName').textContent = r.name;
            document.getElementById('qrDesc').textContent = r.desc;
            setTimeout(() => drawRadar('quickRadar', [65, 55, 70, 60, 50]), 200);
        }

        // =====================================================
        // 完整版逻辑
        // =====================================================
        function showFullQuiz() {
            document.getElementById('quickResult').classList.remove('active');
            document.getElementById('fullQuizPage').classList.add('active');
            fullCurrent = 0;
            fullAnswers = [];
            showFullQuestion();
        }

        function showFullQuestion() {
            if (fullCurrent >= 20) {
                showFullResult();
                return;
            }
            const q = fullQuestions[fullCurrent];
            document.getElementById('fullQNum').textContent = fullCurrent + 1;
            document.getElementById('fullQText').textContent = q.q;
            document.getElementById('fullProgressFill').style.width = ((fullCurrent / 20) * 100) + '%';
            document.getElementById('fullProgressText').textContent = (fullCurrent + 1) + '/20';

            let html = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                const sel = (fullAnswers[fullCurrent] === i) ? ' selected' : '';
                html += `<button class="option${sel}" onclick="selectFull(${i})"><span class="opt-label">${labels[i]}</span>${opt}</button>`;
            });
            document.getElementById('fullOptionsBox').innerHTML = html;
            document.getElementById('fullNextBtn').classList.add('hidden');
        }

        function selectFull(idx) {
            fullAnswers[fullCurrent] = idx;
            const options = document.querySelectorAll('#fullOptionsBox .option');
            options.forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
            document.getElementById('fullNextBtn').classList.remove('hidden');
        }

        function fullNextQuestion() {
            fullCurrent++;
            showFullQuestion();
        }

        function showFullResult() {
            document.getElementById('fullQuizPage').classList.remove('active');

            // 统计选项
            const counts = [0, 0, 0, 0];
            fullAnswers.forEach(a => counts[a]++);
            let maxIdx = 0;
            for (let i = 1; i < 4; i++) {
                if (counts[i] > counts[maxIdx]) maxIdx = i;
            }
            const total = fullAnswers.length;
            const score = Math.round(counts[maxIdx] / total * 100);
            const r = perfumeResults[maxIdx % perfumeResults.length];

            // 五维近似得分
            const dimScores = [0, 0, 0, 0, 0];
            fullAnswers.forEach((a, i) => {
                const dim = Math.floor(i / 4);
                if (dim < 5) dimScores[dim] += (a + 1);
            });
            const dimNorm = dimScores.map(s => Math.min(100, Math.round((s / 16) * 100)));

            let pathText = "";
            if (maxIdx === 0) pathText = "🌿 白茶清欢 → 你的气场是「安静的征服」。不需要用力，不需要解释，你站在那里就已经赢了。继续做那个清冷但有温度的人。";
            else if (maxIdx === 1) pathText = "🌹 玫瑰之约 → 你的气场是「温柔的吸引」。你不需要讨好谁，你的存在本身就是一种邀请。继续做那个浪漫但有力量的人。";
            else if (maxIdx === 2) pathText = "🍊 柑橘阳光 → 你的气场是「快乐的传染」。你让身边的人也变得明亮起来。继续做那个眼里有光、心里有热的人。";
            else if (maxIdx === 3) pathText = "🪵 檀木沉静 → 你的气场是「深度的滋养」。你的存在让人安心，你的沉默让人思考。继续做那个越相处越让人着迷的人。";

            let html = `
                <div class="result-type">${r.type}</div>
                <div class="result-name">${r.name}</div>
                <div class="score">气质匹配度 · ${score}% · ${r.label}</div>
                <div class="result-desc">${r.desc}</div>
                <div class="chart-box">
                    <h4>📊 五维雷达图分析</h4>
                    <div class="radar-container"><canvas id="fullRadar" width="280" height="280"></canvas></div>
                </div>
                <div class="path-box">
                    <h4>🛤️ 你的氛围感进化路径</h4>
                    <p style="font-size:14px;color:#3C2E2A;line-height:1.8">${pathText}</p>
                </div>
                <div class="action-plan">
                    <h4>📋 90天氛围感打造计划</h4>
                    <div class="action-item"><div class="action-num">1</div><div class="action-text"><strong>第1-30天：氛围觉察</strong><br>注意你最喜欢的空间、颜色、气味和音乐——找到让你最放松、最自在的氛围感。</div></div>
                    <div class="action-item"><div class="action-num">2</div><div class="action-text"><strong>第1-30天：寻找你的香</strong><br>去香水店试闻和你测试结果对应的香调，找到最能代表你的那一瓶。</div></div>
                    <div class="action-item"><div class="action-num">3</div><div class="action-text"><strong>第31-60天：氛围营造</strong><br>把那种香水的气味延伸到你的生活空间——香薰、蜡烛、或者同调的身体乳。</div></div>
                    <div class="action-item"><div class="action-num">4</div><div class="action-text"><strong>第61-90天：风格定型</strong><br>让那种氛围感成为你的日常——你的气味、你的穿搭、你的生活，变成一个完整的表达。</div></div>
                </div>
                <p style="font-size:13px;color:#8D6E63;margin-top:16px">💡 香水是穿在身上的情绪<br>找到属于你的那一款，就是找到最舒服的表达</p>
            `;

            const resultDiv = document.getElementById('fullResult');
            resultDiv.innerHTML = html;
            resultDiv.classList.add('active');
            setTimeout(() => drawRadar('fullRadar', dimNorm), 300);
        }

        // =====================================================
        // 雷达图绘制
        // =====================================================
        function drawRadar(cid, data) {
            const c = document.getElementById(cid);
            if (!c) return;
            const ctx = c.getContext('2d');
            const cx = c.width / 2,
                cy = c.height / 2,
                r = 100,
                sides = 5;
            ctx.clearRect(0, 0, c.width, c.height);

            for (let lv = 1; lv <= 5; lv++) {
                ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                    const rr = (r / 5) * lv;
                    const x = cx + rr * Math.cos(a),
                        y = cy + rr * Math.sin(a);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#D7CCC8';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                ctx.strokeStyle = '#D7CCC8';
                ctx.stroke();
            }
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                const rr = (data[i] / 100) * r;
                const x = cx + rr * Math.cos(a),
                    y = cy + rr * Math.sin(a);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(161,136,127,0.25)';
            ctx.fill();
            ctx.strokeStyle = '#A1887F';
            ctx.lineWidth = 2;
            ctx.stroke();
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                const rr = (data[i] / 100) * r;
                ctx.beginPath();
                ctx.arc(cx + rr * Math.cos(a), cy + rr * Math.sin(a), 5, 0, Math.PI * 2);
                ctx.fillStyle = '#6D4C41';
                ctx.fill();
            }
            const dimNames = ["审美偏好", "生活节奏", "性格底色", "情感表达", "内在渴望"];
            ctx.fillStyle = '#3C2E2A';
            ctx.font = '12px -apple-system,sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                ctx.fillText(dimNames[i], cx + (r + 25) * Math.cos(a), cy + (r + 25) * Math.sin(a) + 4);
            }
        }
    </script>
