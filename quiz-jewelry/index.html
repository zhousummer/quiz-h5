<body>
    <div class="container" id="app">

        <!-- 欢迎页 -->
        <div class="welcome" id="welcome">
            <div class="emoji-top">💎</div>
            <h1>你的气质更接近哪种顶级珠宝？</h1>
            <p class="subtitle">20题深度扫描你的气质底色</p>
            <div class="dims">
                <div class="dim-item"><span class="dot"></span> 审美偏好 —— 你的眼睛喜欢什么？</div>

                <div class="dim-item"><span class="dot"></span> 价值追求 —— 你真正想要什么？</div>
            </div>
            <button class="btn" onclick="startQuiz()">开始测试</button>
        </div>

        <!-- 快速版5题 -->
        <div class="quiz-page" id="quizPage">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">1/5</div>
            <div class="question"><span class="q-num" id="qNum">1</span><h3 id="qText"></h3></div>
            <div class="options" id="optionsBox"></div>
            <button class="btn btn-small hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
        </div>

        <!-- 快速版结果 -->
        <div class="quick-result" id="quickResult">
            <div class="result-type" id="qrType"></div>
            <div class="result-name" id="qrName"></div>
            <div class="result-desc" id="qrDesc"></div>
            <div class="result-chart"><canvas id="quickRadar" width="260" height="260"></canvas></div>
            <div class="upgrade-box">
                <h4>🎯 以上只是5题快速版</h4>
                <p>完成全部20题，你将获得：<br>
                ✅ 你的专属气质珠宝标签<br>
                ✅ 五维雷达图深度分析<br>
                ✅ 气质风格解读<br>
                ✅ 专属美学行动指南</p>
                <button class="btn" onclick="showFullQuiz()">解锁完整20题测试</button>
            </div>
        </div>

        <!-- 完整版20题 -->
        <div class="quiz-page" id="fullQuizPage">
            <div class="progress-bar"><div class="progress-fill" id="fullProgressFill"></div></div>
            <div class="progress-text" id="fullProgressText">1/20</div>
            <div class="question"><span class="q-num" id="fullQNum">1</span><h3 id="fullQText"></h3></div>
            <div class="options" id="fullOptionsBox"></div>
            <button class="btn btn-small hidden" id="fullNextBtn" onclick="fullNextQuestion()">下一题</button>
        </div>

        <!-- 完整版结果 -->
        <div class="full-result" id="fullResult"></div>

    </div>

    <script>
        // =====================================================
        // 快速版5题
        // =====================================================
        const quickQuestions = [
            { q: "你更喜欢哪种颜色？", opts: ["纯净无色的白", "炽热浓郁的红色", "深邃幽静的绿色", "温润柔和的珠光白"] },
            { q: "朋友最常形容你的词是：", opts: ["耀眼、自信、强大", "热情、勇敢、有感染力", "神秘、优雅、有深度", "温柔、细腻、有包容力"] },

        // =====================================================
        // 完整版20题
        // =====================================================
        const fullQuestions = [
            { q: "你更喜欢哪种颜色？", opts: ["纯净无色的白", "炽热浓郁的红色", "深邃幽静的绿色", "沉静内敛的蓝色"] },
            { q: "你更喜欢哪种光泽？", opts: ["璀璨闪耀的光芒", "浓郁饱和的色泽", "深邃幽暗的神秘光泽", "温润柔和的珠光"] },
            { q: "你更喜欢哪种形状？", opts: ["棱角分明的切割面", "圆润饱满的弧面", "不规则的原始形态", "光滑流畅的蛋面"] },

            { q: "你更欣赏哪种人？", opts: ["独立自信、不依赖他人", "敢爱敢恨、活得热烈", "有故事、有深度、耐人寻味", "温柔包容、让人安心"] },

            { q: "你更期待什么样的爱情？", opts: ["势均力敌、互相成就", "轰轰烈烈、刻骨铭心", "灵魂共鸣、深刻连接", "温柔陪伴、岁月静好"] },
            { q: "你面对失去的态度是：", opts: ["坦然接受，重新开始", "深刻经历，但会走出来", "沉淀内心，成为故事的一部分", "温柔珍藏，但继续前行"] },
            { q: "你更向往哪种生活方式？", opts: ["光芒四射，被人看见", "活出热度，不留遗憾", "优雅从容，有质感", "平和宁静，有温度"] },
            { q: "你面对压力时的反应是：", opts: ["越压越强，迎难而上", "释放情绪，用热情化解", "沉稳应对，找到解决方案", "保持平静，慢慢消化"] },
            { q: "你更看重什么？", opts: ["成就和价值感", "体验和感受", "深度和意义", "关系和温暖"] },
            { q: "你更倾向于哪种社交状态？", opts: ["社交中心，擅长活跃气氛", "有感染力，能带动氛围", "选择性社交，喜欢深度交流", "温和舒适，让人放松"] },
            { q: "你希望自己的人生是什么样的？", opts: ["闪耀而有意义", "热烈而不留遗憾", "深刻而有故事", "温暖而有爱"] },
            { q: "你更害怕什么？", opts: ["失去光芒和存在感", "活得平庸、没有波澜", "失去深度和自我", "失去重要的人"] },
            { q: "你更想要被记住的是什么？", opts: ["你的成就和影响力", "你的热情和勇敢", "你的故事和深度", "你的温柔和善良"] },
            { q: "你内心最向往的状态是：", opts: ["站在高处，光芒万丈", "活得热烈，不负此生", "内心丰盈，自有一片天地", "被爱包围，温柔一生"] }
        ];

        // =====================================================
        // 6种珠宝气质
        // =====================================================
        const results = [{
            type: "💎",
            name: "钻石 · 闪耀自信型",
            desc: "你像一颗钻石——在压力下形成，在切割后闪耀。你有一种天生的光芒感，不依赖任何人的认可，你本身就是光。你独立、坚定、知道自己要什么。你不需要被定义，你定义自己。你的气质是「有棱角的温柔」——看起来坚硬，但光芒里有温度。",
            label: "光芒四射",
            keywords: "独立、坚定、闪耀"
        }, {
            type: "❤️",
            name: "红宝石 · 炽热张扬型",
            desc: "你像一颗红宝石——热烈、浓郁、不可忽视。你活得很真实，爱得坦荡，恨得干脆。你不怕被人看见，也不怕被人记住。你相信人生只有一次，必须滚烫地活。你的气质是「藏不住的热烈」——你站在那里，就已经是故事的开头。",
            label: "热情张扬",
            keywords: "热烈、勇敢、有力量"
        }, {
            type: "🌿",
            name: "祖母绿 · 优雅神秘型",
            desc: "你像一颗祖母绿——深邃、神秘、越看越有味道。你不急于表达自己，但你的沉默里藏着故事。你有一种让人想靠近却又不敢轻易打扰的气场。你的气质是「有深度的优雅」——你不需要解释自己，懂你的人自然懂。",
            label: "深邃神秘",
            keywords: "深邃、优雅、有故事"
        }, {
            type: "🌊",
            name: "蓝宝石 · 冷静睿智型",
            desc: "你像一颗蓝宝石——沉静、理性、有深度。你做事有章法，思考有逻辑，情绪不轻易外露，但内心有一片海。你是那种「越了解越让人安心」的人。你的气质是「稳得住场面的温柔」——你不张扬，但你是定海神针。",
            label: "沉稳睿智",
            keywords: "理性、沉稳、有深度"
        }, {
            type: "🌙",
            name: "珍珠 · 温柔治愈型",
            desc: "你像一颗珍珠——在蚌壳里耐心生长，在时间里打磨光泽。你温柔、包容、让人安心。你不是最耀眼的那一个，但你是最让人舍不得离开的那一个。你的气质是「安静地发着光」——你不争不抢，但你在的地方，就是光。",
            label: "温柔治愈",
            keywords: "温润、优雅、有包容力"
        }, {
            type: "🌸",
            name: "翡翠 · 东方清雅型",
            desc: "你像一块翡翠——内敛、温润、有底蕴。你身上有一种东方的静气，不追赶潮流，不迎合他人，有自己的节奏和审美。你是那种「越看越耐看」的人。你的气质是「不张扬的贵气」——你不需要证明自己，你的存在本身就是答案。",
            label: "东方清雅",
            keywords: "内敛、有底蕴、雅致"
        }];

        // =====================================================
        // 状态变量
        // =====================================================
        let quickAnswers = [];
        let quickCurrent = 0;
        let fullAnswers = [];
        let fullCurrent = 0;

        // =====================================================
        // 快速版逻辑
        // =====================================================
        function startQuiz() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('quizPage').classList.add('active');
            quickCurrent = 0;
            quickAnswers = [];
            showQuickQuestion();
        }

        function showQuickQuestion() {
            if (quickCurrent >= 5) {
                showQuickResult();
                return;
            }
            const q = quickQuestions[quickCurrent];
            document.getElementById('qNum').textContent = quickCurrent + 1;
            document.getElementById('qText').textContent = q.q;
            document.getElementById('progressFill').style.width = ((quickCurrent / 5) * 100) + '%';
            document.getElementById('progressText').textContent = (quickCurrent + 1) + '/5';

            let html = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                const sel = (quickAnswers[quickCurrent] === i) ? ' selected' : '';
                html += `<button class="option${sel}" onclick="selectQuick(${i})"><span class="opt-label">${labels[i]}</span>${opt}</button>`;
            });
            document.getElementById('optionsBox').innerHTML = html;
            document.getElementById('nextBtn').classList.add('hidden');
        }

        function selectQuick(idx) {
            quickAnswers[quickCurrent] = idx;
            const options = document.querySelectorAll('#optionsBox .option');
            options.forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            quickCurrent++;
            showQuickQuestion();
        }

        function showQuickResult() {
            document.getElementById('quizPage').classList.remove('active');
            document.getElementById('quickResult').classList.add('active');
            const counts = [0, 0, 0, 0];
            quickAnswers.forEach(a => counts[a]++);
            let maxIdx = 0;
            for (let i = 1; i < 4; i++) {
                if (counts[i] > counts[maxIdx]) maxIdx = i;
            }
            const r = results[maxIdx % results.length];
            document.getElementById('qrType').textContent = r.type;
            document.getElementById('qrName').textContent = r.name;
            document.getElementById('qrDesc').textContent = r.desc;
            setTimeout(() => drawRadar('quickRadar', [65, 55, 70, 60, 50]), 200);
        }

        // =====================================================
        // 完整版逻辑
        // =====================================================
        function showFullQuiz() {
            document.getElementById('quickResult').classList.remove('active');
            document.getElementById('fullQuizPage').classList.add('active');
            fullCurrent = 0;
            fullAnswers = [];
            showFullQuestion();
        }

        function showFullQuestion() {
            if (fullCurrent >= 20) {
                showFullResult();
                return;
            }
            const q = fullQuestions[fullCurrent];
            document.getElementById('fullQNum').textContent = fullCurrent + 1;
            document.getElementById('fullQText').textContent = q.q;
            document.getElementById('fullProgressFill').style.width = ((fullCurrent / 20) * 100) + '%';
            document.getElementById('fullProgressText').textContent = (fullCurrent + 1) + '/20';

            let html = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                const sel = (fullAnswers[fullCurrent] === i) ? ' selected' : '';
                html += `<button class="option${sel}" onclick="selectFull(${i})"><span class="opt-label">${labels[i]}</span>${opt}</button>`;
            });
            document.getElementById('fullOptionsBox').innerHTML = html;
            document.getElementById('fullNextBtn').classList.add('hidden');
        }

        function selectFull(idx) {
            fullAnswers[fullCurrent] = idx;
            const options = document.querySelectorAll('#fullOptionsBox .option');
            options.forEach((el, i) => {
                el.classList.toggle('selected', i === idx);
            });
            document.getElementById('fullNextBtn').classList.remove('hidden');
        }

        function fullNextQuestion() {
            fullCurrent++;
            showFullQuestion();
        }

        function showFullResult() {
            document.getElementById('fullQuizPage').classList.remove('active');

            const counts = [0, 0, 0, 0];
            fullAnswers.forEach(a => counts[a]++);
            let maxIdx = 0;
            for (let i = 1; i < 4; i++) {
                if (counts[i] > counts[maxIdx]) maxIdx = i;
            }

            let ri = maxIdx % results.length;
            if (maxIdx === 0 && counts[3] >= 5) ri = 3;
            else if (maxIdx === 2 && counts[3] >= 5) ri = 5;
            else if (maxIdx === 1 && counts[3] >= 5) ri = 4;

            const r = results[ri];
            const score = Math.round(counts[maxIdx] / 20 * 100);

            const dimScores = [0, 0, 0, 0, 0];
            fullAnswers.forEach((a, i) => {
                const dim = Math.floor(i / 4);
                if (dim < 5) dimScores[dim] += (a + 1);
            });
            const dimNorm = dimScores.map(s => Math.min(100, Math.round((s / 16) * 100)));

            let pathText = "";
            if (ri === 0) pathText = "💎 钻石 → 你不必隐藏自己的光芒。这个世界需要更多像你一样坚定发亮的人。继续闪耀，别为任何人的目光停下来。";
            else if (ri === 1) pathText = "❤️ 红宝石 → 你的热烈是礼物。不要因为怕太耀眼而收敛，你生来就是为了被记住的。继续勇敢地发光。";
            else if (ri === 2) pathText = "🌿 祖母绿 → 你的深度是你最大的魅力。不必为了迎合谁而变浅，那些能欣赏你深度的人，才值得你的故事。";
            else if (ri === 3) pathText = "🌊 蓝宝石 → 你的沉稳是力量。在这个喧嚣的世界里，能保持理性是一种稀缺能力。继续做那个在风浪中依然平静的人。";
            else if (ri === 4) pathText = "🌙 珍珠 → 你的温柔是一种强大的力量。你不必成为最耀眼的那一个，你的存在本身就已经治愈了很多人。";
            else pathText = "🌸 翡翠 → 你的内敛是贵气。你不需要追赶任何潮流，你就是潮流。继续做那个有自己美学体系的人。";

            const actions = [
                ["第1-30天：审美觉察", "注意你日常中不自觉被吸引的颜色、质感和形状——它们是你气质基因的外显信号。"],
                ["第1-30天：单品投资", "根据你的珠宝气质，选择一件能代表你风格的单品（首饰/衣服/配饰），让它成为你的「气质名片」。"],
                ["第31-60天：氛围营造", "把那种气质延伸到你的空间——香水、装饰、生活物件，让你的气场更完整。"],
                ["第61-90天：风格定型", "让那种气质成为你的日常表达。你不是在扮演谁，你只是在做更完整的自己。"]
            ];

            let html = `
                <div class="result-type">${r.type}</div>
                <div class="result-name">${r.name}</div>
                <div class="score">气质匹配度 · ${score}% · ${r.label}</div>
                <div class="result-desc">${r.desc}</div>
                <div class="chart-box">
                    <h4>📊 五维雷达图分析</h4>
                    <div class="radar-container"><canvas id="fullRadar" width="280" height="280"></canvas></div>
                </div>
                <div class="path-box">
                    <h4>🛤️ 你的气质进化路径</h4>
                    <p style="font-size:14px;color:#3C2E2A;line-height:1.8">${pathText}</p>
                </div>
                <div class="action-plan">
                    <h4>📋 90天气质养成计划</h4>
                    ${actions.map((a, i) => `
                        <div class="action-item">
                            <div class="action-num">${i+1}</div>
                            <div class="action-text"><strong>${a[0]}</strong><br>${a[1]}</div>
                        </div>
                    `).join('')}
                </div>
                <p style="font-size:13px;color:#8D6E63;margin-top:16px">💡 顶级珠宝不是用来炫耀的<br>它是你气质的延伸，是你看世界的方式</p>
            `;

            const resultDiv = document.getElementById('fullResult');
            resultDiv.innerHTML = html;
            resultDiv.classList.add('active');
            setTimeout(() => drawRadar('fullRadar', dimNorm), 300);
        }

        // =====================================================
        // 雷达图绘制
        // =====================================================
        function drawRadar(cid, data) {
            const c = document.getElementById(cid);
            if (!c) return;
            const ctx = c.getContext('2d');
            const cx = c.width / 2,
                cy = c.height / 2,
                r = 100,
                sides = 5;
            ctx.clearRect(0, 0, c.width, c.height);

            for (let lv = 1; lv <= 5; lv++) {
                ctx.beginPath();
                for (let i = 0; i < sides; i++) {
                    const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                    const rr = (r / 5) * lv;
                    const x = cx + rr * Math.cos(a),
                        y = cy + rr * Math.sin(a);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#D7CCC8';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                ctx.strokeStyle = '#D7CCC8';
                ctx.stroke();
            }
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                const rr = (data[i] / 100) * r;
                const x = cx + rr * Math.cos(a),
                    y = cy + rr * Math.sin(a);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(161,136,127,0.25)';
            ctx.fill();
            ctx.strokeStyle = '#A1887F';
            ctx.lineWidth = 2;
            ctx.stroke();
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                const rr = (data[i] / 100) * r;
                ctx.beginPath();
                ctx.arc(cx + rr * Math.cos(a), cy + rr * Math.sin(a), 5, 0, Math.PI * 2);
                ctx.fillStyle = '#6D4C41';
                ctx.fill();
            }
            const dimNames = ["审美偏好", "性格底色", "情感表达", "生活态度", "价值追求"];
            ctx.fillStyle = '#3C2E2A';
            ctx.font = '12px -apple-system,sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i < sides; i++) {
                const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
                ctx.fillText(dimNames[i], cx + (r + 25) * Math.cos(a), cy + (r + 25) * Math.sin(a) + 4);
            }
        }
    </script>
</body>
